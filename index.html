<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
  <title>Cloud Test</title>
  <title>My Cloud Contacts</title>
</head>
<body>
  <h1>Contact Cloud</h1>

  <input id="email" placeholder="email">
  <input id="password" placeholder="password" type="password">
  <button onclick="login()">Login</button>

  <hr>

  <input id="name" placeholder="name">
  <input id="phone" placeholder="phone">
  <button onclick="saveContact()">Save</button>

  <ul id="list"></ul>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabaseUrl = "https://vpqxdhzeldasalheqdnr.supabase.co";
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZwcXhkaHplbGRhc2FsaGVxZG5yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzOTE4MzMsImV4cCI6MjA5NDk2NzgzM30.53tMdEarbcNwiyRoviJUvCSxlq6nfh-3Ryqsisiz9tU";

    const supabase = createClient(supabaseUrl, supabaseKey);

    window.login = async function () {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      await supabase.auth.signInWithPassword({ email, password });
      loadContacts();
    };

    window.saveContact = async function () {
      const name = document.getElementById("name").value;
      const phone = document.getElementById("phone").value;

      const user = await supabase.auth.getUser();

      await supabase.from("contacts").insert({
        name,
        phone,
        user_id: user.data.user.id
      });

      loadContacts();
    };

    async function loadContacts() {
      const { data } = await supabase.from("contacts").select("*");
      
      document.getElementById("list").innerHTML =
        data.map(c => `<li>${c.name} - ${c.phone}</li>`).join("");
    }
  </script>
</body>
</html>
